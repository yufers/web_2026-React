<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./login.css">
    <title>Abito</title>
</head>
<body>
    <div class="login">
        <div class="container">
            <div class="login-box">
                <h1 class="login-box__title">Регистрация</h1>
                <form class="login-box__form" action="#">
                    <input type="email" id="email" name="email" placeholder="Введите ваш email" required>
                    <input type="password" id="password" name="password" placeholder="Введите ваш пароль" required>
                    <button type="submit" class="login-box__submit">Зарегистрироваться</button>
                </form>
                <a href="./login.html" class="login-box__create-account">Уже есть аккаунт? Войти</a>
            </div>
        </div>
    </div>
</body>
</html>
